<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background-color: #000000; 
            color: #ffffff; 
            margin: 0; 
            padding: 0; 
            line-height: 1.5;
        }
        header { 
            background-color: #111111; 
            border-bottom: 1px solid #333333; 
            padding: 20px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { 
            font-size: 1.8em; 
            font-weight: 900; 
            letter-spacing: 2px; 
            margin: 0;
            color: #ffffff;
        }
        .live-status { 
            color: #ff3b30; 
            font-weight: 700; 
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 10px;
            height: 10px;
            background-color: #ff3b30;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); } 
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); } 
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); } 
        }
        
        .main-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .text-column {
            width: 60%;
        }
        
        .system-info { 
            background: #111; 
            border: 1px solid #222; 
            padding: 15px; 
            border-radius: 5px; 
            margin-bottom: 30px; 
            font-size: 0.9em; 
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
        }
        
        h2 { 
            font-size: 2.2em; 
            font-weight: 800; 
            margin-bottom: 10px;
            line-height: 1.1;
            color: #ffffff;
        }
        .subtitle { 
            color: #888888; 
            font-size: 1.1em; 
            margin-bottom: 40px; 
        }
        .alert-box { 
            background-color: rgba(255, 59, 48, 0.1); 
            border: 1px solid #ff3b30; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 40px;
        }
        .alert-box h3 {
            color: #ff3b30;
            margin-top: 0;
            font-size: 1.2em;
            text-transform: uppercase;
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
        }
        @media (min-width: 600px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }
        .card { 
            background-color: #1a1a1a; 
            padding: 25px; 
            border-radius: 12px; 
        }
        .card h4 { 
            margin-top: 0; 
            font-size: 1.1em; 
            color: #ffffff;
            border-bottom: 1px solid #333333;
            padding-bottom: 10px;
        }
        .card p { 
            color: #aaaaaa; 
            font-size: 0.9em; 
        }
        
        .video-column {
            width: 35%;
            position: sticky;
            top: 20px;
        }
        .video-container { 
            background: #000; 
            border: 1px solid #333; 
            border-radius: 20px; 
            padding: 10px; 
            margin-bottom: 40px; 
            text-align: center; 
            aspect-ratio: 9/16; 
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .video-player { 
            width: 100%; 
            height: 100%;
            background: #1a1a1a; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #555; 
            font-size: 0.8em; 
            object-fit: cover; 
        }
        
        .certifications { 
            margin-top: 50px; 
            border-top: 1px solid #1a1a1a; 
            padding-top: 30px; 
            text-align: center; 
            background-color: #050505;
        }
        .certifications h3 { 
            color: #666666; 
            font-size: 0.85em; 
            letter-spacing: 2px; 
            margin-bottom: 20px; 
            text-transform: uppercase;
        }
        .cert-badge-container { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            flex-wrap: wrap; 
        }
        .cert-badge { 
            background-color: #111111; 
            border: 1px solid #222; 
            padding: 10px 15px; 
            border-radius: 4px; 
            color: #888888; 
            font-size: 0.8em; 
            font-weight: bold; 
            letter-spacing: 1px; 
            text-transform: uppercase;
        }
